# Servidor: a imagem vem pronta do CI (docker save | docker load) com a etiqueta do commit.
# Cada ambiente tem o seu COMPOSE_PROJECT_NAME e a sua porta no .env (ver deploy/env.*.example).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: bolao-web:${WEB_TAG:-local}
    restart: unless-stopped
    # Rede do host: o nginx do CloudPanel fala com 127.0.0.1:WEB_PORT.
    network_mode: host
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: ${WEB_PORT:-3000}
    logging: *logging
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WEB_PORT:-3000}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
